name: PR Tests

on:
  pull_request:
    branches:
      - testing_branch
    paths:
      - '**/*.tf'

permissions:
  contents: read
  pull-requests: read
    
jobs:
  detect_changes:
    runs-on: ubuntu-latest

    outputs:
      aap-asm: ${{ steps.filter.outputs.aap-asm }}
      aap: ${{ steps.filter.outputs.aap }}
      bmp: ${{ steps.filter.outputs.bmp }}
      delivery: ${{ steps.filter.outputs.delivery }}
      ds2: ${{ steps.filter.outputs.ds2 }}
      dv-san-cert: ${{ steps.filter.outputs.dv-san-cert }}
      edns: ${{ steps.filter.outputs.edns }}
      third-party-cert: ${{ steps.filter.outputs.third-party-cert }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed folders
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            aap-asm:
              - 'aap-asm/**'
            aap:
              - 'aap/**'
            bmp:
              - 'bmp/**'
            delivery:
              - 'delivery/**'
            ds2:
              - 'ds2/**'
            dv-san-cert:
              - 'dv-san-cert/**'
            edns:
              - 'edns/**'
            third-party-cert:
              - 'third-party-cert/**'


  aap-asm:
    needs: detect_changes
    if: needs.detect_changes.outputs.aap-asm == 'true'
    uses: ./.github/workflows/pr-tests-appsec.yml
    with:
        module_source: aap-asm
    secrets: inherit

  aap:
    needs: detect_changes
    if: needs.detect_changes.outputs.aap == 'true' && 1 == 2
    uses: ./.github/workflows/pr-tests.yml
    with:
        module_source: aap
    secrets: inherit

  bmp:
    needs: detect_changes
    if: needs.detect_changes.outputs.bmp == 'true'
    uses: ./.github/workflows/pr-tests-appsec.yml
    with:
        module_source: bmp
    secrets: inherit

  delivery:
    needs: detect_changes
    if: needs.detect_changes.outputs.delivery == 'true'
    uses: ./.github/workflows/pr-tests.yml
    with:
        module_source: delivery
    secrets: inherit

  ds2:
    needs: detect_changes
    if: needs.detect_changes.outputs.ds2 == 'true'
    uses: ./.github/workflows/pr-tests.yml
    with:
        module_source: ds2
    secrets: inherit

  dv-san-cert:
    needs: detect_changes
    if: needs.detect_changes.outputs.dv-san-cert == 'true'
    uses: ./.github/workflows/pr-tests-cps.yml
    with:
        module_source: dv-san-cert
    secrets: inherit

  edns:
    needs: detect_changes
    if: needs.detect_changes.outputs.edns == 'true'
    uses: ./.github/workflows/pr-tests.yml
    with:
        module_source: edns
    secrets: inherit

  third-party-cert:
    needs: detect_changes
    if: needs.detect_changes.outputs.third-party-cert == 'true'
    uses: ./.github/workflows/pr-tests-cps-2.yml
    with:
        module_source: third-party-cert
    secrets: inherit  
