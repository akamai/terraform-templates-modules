name: Delivery Tests

on:
  workflow_call:
    inputs:
      module_source:
        required: true
        type: string
      module_mode:
        required: false
        type: string
        default: "none" 
jobs:
  
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate test permutations matrix
        id: set-matrix
        run: |
          CONFIG_FILE="${{ inputs.module_source }}/tests/config.json"
          MAX=50

          MATRIX=$(jq -cn \
            --argjson cfg "$(cat "$CONFIG_FILE")" \
            --argjson max "$MAX" '
            
            def build(idx; current; keys):
              if idx == (keys | length) then
                current
              else
                keys[idx] as $k
                | $cfg[$k][] as $val
                | build(idx + 1; current + { ($k): $val }; keys)
              end;

            [
              limit($max; build(0; {}; $cfg | keys_unsorted))
              | . + {
                  label: (
                    to_entries
                    | map("\(.key)=\(.value)")
                    | join(", ")
                  )
                }
            ]
          ')

          MATRIX=$(echo "$MATRIX" | jq -c '.[]' | while read -r item; do
          r="a$(LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c 10)"
          echo "$item" | jq -c --arg r "$r" '
            . + { 
              name: $r, 
              label: (.label + ", name=\($r)") 
            }'
          done | jq -cs '.')

          echo "Generated matrix:"
          echo "$MATRIX"

          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Print all permutations
        run: |
          echo "===== ALL GENERATED PERMUTATIONS ====="
          echo '${{ steps.set-matrix.outputs.matrix }}' | jq '.'
            
  tests:
    name: ${{ matrix.label }}
    needs: generate-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    env:
      AKAMAI_HOST: ${{ secrets.HOST }}
      AKAMAI_CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
      AKAMAI_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      AKAMAI_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      AKAMAI_ACCOUNT_KEY: "1-5BYUG1:1-8BYUX"


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Prepare Terraform
        run: |
          TFVARS_TEMPLATE="${{ inputs.module_source }}/tests/tfvars.tpl"

          # Dynamically export all matrix variables as uppercase env vars
          while IFS= read -r line; do
            export "$line"
            echo "$line" >> "$GITHUB_ENV"
          done < <(echo '${{ toJson(matrix) }}' | jq -r '
            to_entries[] |
            if .key == "name" then "MATRIX_NAME=\(.value)"
            elif .key == "label" then empty
            else "\(.key | ascii_upcase)=\(.value)"
            end
          ')

          cd "${{ inputs.module_source }}"
          
          envsubst < "../$TFVARS_TEMPLATE" > "terraform.tfvars"
          echo "" >> "terraform.tfvars"
          envsubst < "tests/main.tf.tpl" > "main.tf"
          envsubst < "tests/variables.tf.tpl" > "variables.tf"
          envsubst < "tests/outputs.tf.tpl" > "outputs.tf"
          envsubst < "tests/versions.tf.tpl" > "versions.tf"
          echo 'provider "akamai" {}' >> "provider.tf"
          
          echo "===== Initialize Terraform for the test ====="
          terraform init
          
      - name: Manage Prerequisites
        run: |
          cd "${{ inputs.module_source }}"
          mkdir prerequisites
          envsubst < "tests/prerequisites.tf.tpl" > "prerequisites/main.tf"
          envsubst < "tests/variables.tf.tpl" > "prerequisites/variables.tf"
          envsubst < "tests/versions-delivery.tf.tpl" > "prerequisites/versions.tf"
          cp "terraform.tfvars" "prerequisites/terraform.tfvars"
          echo 'provider "akamai" {}' >> "prerequisites/provider.tf"
          cd "prerequisites"
          echo "===== Terraform Init ====="
          terraform init
          echo "===== Terraform Apply ====="
          terraform apply -input=false -auto-approve -no-color
        
      - name: Terraform deploy
        run: |
          cd "${{ inputs.module_source }}"
          
          set -uo pipefail
          set +e
          set -x

          terraform plan -input=false -detailed-exitcode -no-color -out=tfplan > >(tee -a plan.out) 2> >(tee -a plan.out >&2)
          PLAN_EXIT_CODE=$?

          if [ "$PLAN_EXIT_CODE" -ne 0 ] && [ "$PLAN_EXIT_CODE" -ne 2 ]; then
            set -e
            echo "::error title=Terraform Plan Failed::Check summary for details"
            
            echo "## ❌ Terraform Plan Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Module:**  ${{ inputs.module_source }} " >> $GITHUB_STEP_SUMMARY
            echo "**Test:** ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
            echo "**Exit Code:** $PLAN_EXIT_CODE" >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🧾 Error Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 50 plan.out >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            exit 1
          fi

          MAX_RETRIES=2
          RETRY_COUNT=0
          APPLY_EXIT_CODE=1
          SUCCESS=0
          set +e

          while [ "$SUCCESS" -eq 0 ] && [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            terraform apply -input=false -auto-approve -no-color tfplan > >(tee -a apply.out) 2> >(tee -a apply.out >&2)
            APPLY_EXIT_CODE=$?

            if [ "$APPLY_EXIT_CODE" -eq 0 ]; then
              SUCCESS=1
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
              break
            fi

            echo "Re-planning before retry..."
            terraform plan -input=false -detailed-exitcode -no-color -out=tfplan > >(tee -a replan.out) 2> >(tee -a replan.out >&2)
            REPLAN_EXIT_CODE=$?

            if [ "$REPLAN_EXIT_CODE" -ne 0 ] && [ "$REPLAN_EXIT_CODE" -ne 2 ]; then
              APPLY_EXIT_CODE=$REPLAN_EXIT_CODE
              cp replan.out apply.out
              break
            fi

            echo "Retrying terraform apply..."
          done

          set -e

          if [ "$APPLY_EXIT_CODE" -ne 0 ]; then
            echo "::error title=Terraform Apply Failed::Check summary for details"
            
            echo "## ❌ Terraform Apply Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Module:**  ${{ inputs.module_source }} " >> $GITHUB_STEP_SUMMARY
            echo "**Test:** ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
            echo "**Exit Code:** $APPLY_EXIT_CODE" >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🧾 Error Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 50 apply.out >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            exit 1
          fi

      - name: Wait
        run: sleep 60

      - name: Terraform destroy
        if: always()
        run: |
          cd "${{ inputs.module_source }}"
          set -uo pipefail
          set +e
          set -x

          MAX_RETRIES=2
          RETRY_COUNT=0
          EXIT_CODE=1

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            terraform destroy -input=false -auto-approve -no-color > >(tee -a destroy.out) 2> >(tee -a destroy.out >&2)
            EXIT_CODE=$?

            if [ "$EXIT_CODE" -eq 0 ]; then
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
              echo "Retrying terraform destroy..."
            fi
          done

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            DESTROY_TAIL="$(tail -n 50 destroy.out 2>/dev/null || true)"
            EXPECTED_DESTROY_REGEX="^Error: cannot delete configuration '[^']+' as version [0-9]+ has been active in staging or production$"
            DESTROY_ERROR_LINES="$(printf '%s\n' "$DESTROY_TAIL" | grep '^Error:' || true)"

            if [ -n "$DESTROY_ERROR_LINES" ] && ! printf '%s\n' "$DESTROY_ERROR_LINES" | grep -Ev "$EXPECTED_DESTROY_REGEX" >/dev/null; then
              echo "::warning title=Terraform Destroy Partial Cleanup::Known active configuration cannot be deleted yet; continuing."
              exit 0
            else
              echo "::error title=Terraform Destroy Failed::Check summary for details"
              
              echo "## ❌ Terraform Destroy Failed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Module:**  ${{ inputs.module_source }} " >> $GITHUB_STEP_SUMMARY
              echo "**Test:** ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
              echo "**Exit Code:** $EXIT_CODE" >> $GITHUB_STEP_SUMMARY

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🧾 Error Output" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 50 destroy.out >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY

              exit 1
            fi
          fi

          cd "prerequisites"
          echo "===== Terraform Destroy ====="
          PRE_MAX_RETRIES=2
          PRE_RETRY_COUNT=0
          PRE_EXIT_CODE=1

          while [ "$PRE_RETRY_COUNT" -lt "$PRE_MAX_RETRIES" ]; do
            terraform destroy -input=false -auto-approve -no-color
            PRE_EXIT_CODE=$?

            if [ "$PRE_EXIT_CODE" -eq 0 ]; then
              break
            fi

            PRE_RETRY_COUNT=$((PRE_RETRY_COUNT + 1))
            if [ "$PRE_RETRY_COUNT" -lt "$PRE_MAX_RETRIES" ]; then
              echo "Retrying prerequisites terraform destroy..."
            fi
          done

          if [ "$PRE_EXIT_CODE" -ne 0 ]; then
            echo "::error title=Prerequisites Terraform Destroy Failed::Check summary for details"

            echo "## ❌ Prerequisites Terraform Destroy Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Module:**  ${{ inputs.module_source }} " >> $GITHUB_STEP_SUMMARY
            echo "**Test:** ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
            echo "**Exit Code:** $PRE_EXIT_CODE" >> $GITHUB_STEP_SUMMARY

            exit 1
          fi
          